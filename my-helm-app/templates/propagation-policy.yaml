apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: demo-nginx-pp
  namespace: {{ .Release.Namespace }}
spec:
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      name: demo-nginx  # 与 deployment.yaml 中的名称一致
    - apiVersion: v1
      kind: Service
      name: demo-nginx-svc  # 与 service.yaml 中的名称一致
  placement:
    clusterAffinity:
      clusterNames:
        - pj-cluster
        - zp-cluster